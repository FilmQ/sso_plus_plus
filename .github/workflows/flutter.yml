name: flutter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # The default target is lib/main.dart, the patient mobile app.
      - run: flutter build apk --debug
      - run: flutter build appbundle --debug
      # The staff console is a separate entry point. Without -t this would
      # build the patient app for the browser, which is not a supported
      # surface.
      - run: flutter build web --release -t lib/main_console.dart

  ios:
    name: Build iOS
    # Wait for the cheap Linux job. A macOS runner costs much more, so it must
    # not start while the analysis or the tests fail.
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get
      # CI holds no signing certificate, so the build must not sign the binary.
      - run: flutter build ios --debug --no-codesign
